name: nexus-motion

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: nexus-motion:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD:-nexus}@postgres:5432/nexus
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_ROOT: /data/storage
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
  volumes:
    - media:/data/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Workers do the expensive part. Scale them, not the API:
  #   docker compose up -d --scale worker=4
  worker:
    <<: *app
    command: ["python", "-m", "nexus.worker.main"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "4", memory: 4G }

volumes:
  pgdata:
  redisdata:
  media:
